<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PyFoma.js – FST playground</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header>
  <h1>PyFoma.js</h1>
  <label for="demoSelect">Demo</label>
  <select id="demoSelect"></select>
  <div class="spacer"></div>
  <a href="doc">API Documentation</a>
</header>

<main>
  <section class="panel">
    <div class="bar">
      <div class="title">Program</div>
      <div class="spacer"></div>
      <label class="toggle" title="Wrap long lines">
        <input id="wrapToggle" type="checkbox" checked /> Wrap
      </label>
      <button id="runBtn">Run</button>
      <button id="clearBtn">Clear output</button>
    </div>
    <div class="editorWrap">
      <pre id="codeHL" aria-hidden="true"></pre>
      <textarea id="code" spellcheck="false" wrap="soft">$consonant = /[a-z] - [aeiou]/
// Introduction
    
// This demoes a pyfoma port to js (see https://github.com/mhulden/pyfoma)
// You can compile regexes into finite-state automata and transducers
// Everything runs in the browser

// Writing /regex/ by itself compiles a regex an immediately displays it

// You can also write regexes and store the FSTs into variables. Example:

// $consonant = [a-z] - [aeiou]

// ... and then re-use the definition in new regexes:

// $syllable = $consonant+ [aeiou] $consonant+

// view($variable) displays the FST
// generate($variable, string, string, ...) passes strings to the FST
// analyze($variable, string, string, ...) does the inverse calculation

// Example:

$myfst = $^rewrite(a:b / c _ d)
view($myfst)
generate($myfst, cadcab, cab)
analyze($myfst, cbd) 

// You can save an FST in .foma format for
// import into foma or pyfoma, with 
// tofoma($myfst)
// and then "Save output..."

// See pull-down menu above for more examples
</textarea>
    </div>
    <div class="footer">
      Graph rendering uses <code>@viz-js/viz</code> 3.28.0.
    </div>
  </section>

  <section class="panel">
    <div class="bar">
      <div class="title">Output</div>
      <div class="spacer"></div>
      <button id="saveBtn">Save output…</button>
      <button id="fitBtn">Fit graph</button>
    </div>
    <div id="graph"><div class="placeholder">(No graph yet. Run <code>view(...)</code>.)</div></div>
    <div id="console"></div>
  </section>
</main>

<!-- Our app -->
<script type="module" src="./site.js"></script>
</body>
</html>
